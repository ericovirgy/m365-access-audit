name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      - name: Fixtures mode end to end
        run: uv run m365-access-audit --source fixtures
